services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
      POSTGRES_DB: checkstock
    ports:
      - "5442:5432"  # нестандартный порт, чтобы не конфликтовать с локальным Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkstock -d checkstock"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://checkstock:checkstock@db:5432/checkstock
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # docker compose run --rm tests — тесты на настоящем Postgres (отдельная база checkstock_test)
  tests:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://checkstock:checkstock@db:5432/checkstock_test
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest"]

volumes:
  pgdata:
